[project]
name = "ha-grid-load-shedding"
version = "0.2.1"
description = "Home Assistant integration: detect utility-grid loss and shed/restore loads"
requires-python = ">=3.14.2"

[dependency-groups]
dev = [
    "pytest-homeassistant-custom-component==0.13.357",  # = Home Assistant 2026.8.3
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
